<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>선례(先例) — 먼저 간 사람들</title>
<meta name="description" content="부모님이 반대할 때, 그 길을 이미 걸어본 사람의 이야기를 찾아주는 곳." />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          paper:  '#F8F5EE',
          paper2: '#FFFDF7',
          ink:    '#221F1A',
          ink2:   '#4A443B',
          ink3:   '#7B7466',
          line:   '#E3DCCC',
          accent: '#A8432B'
        }
      }
    }
  }
</script>
<style>
  :root{
    --paper:#F8F5EE;
    --paper2:#FFFDF7;
    --ink:#221F1A;
    --ink2:#4A443B;
    --ink3:#7B7466;
    --line:#E3DCCC;
    --line2:#D3C9B4;
    --accent:#A8432B;
    --accent-soft:#F4E8E3;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  html{scroll-behavior:smooth}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    letter-spacing:-0.021em;
    word-break:keep-all;
    overflow-wrap:break-word;
  }
  ::selection{background:var(--accent);color:#fff}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;letter-spacing:inherit}
  input{font:inherit;letter-spacing:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}

  /* ---------- 공용 ---------- */
  .wrap{width:100%;max-width:1080px;margin:0 auto;padding:0 24px}
  .wrap-narrow{width:100%;max-width:760px;margin:0 auto;padding:0 24px}
  .hairline{height:1px;background:var(--line);border:0}
  .kicker{font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--ink3);text-transform:uppercase}
  .serifnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

  .brand{display:inline-flex;align-items:baseline;gap:8px;font-weight:800;font-size:19px;letter-spacing:-0.03em}
  .brand small{font-size:12px;font-weight:600;color:var(--ink3);letter-spacing:.06em}

  /* ---------- 인트로 ---------- */
  #introOverlay{
    position:fixed;inset:0;z-index:60;background:var(--paper);
    display:grid;place-items:center;padding:24px;
    transition:opacity .75s ease;
  }
  #introOverlay.gone{opacity:0;pointer-events:none}
  .intro-line{
    max-width:1000px;text-align:center;font-weight:800;
    font-size:clamp(30px,6.4vw,62px);line-height:1.24;letter-spacing:-0.04em;
    color:var(--ink);
    opacity:0;transform:translateY(16px) scale(.985);
    transition:opacity .55s ease,transform .75s cubic-bezier(.16,.84,.3,1);
  }
  .intro-line.show{opacity:1;transform:none}
  #skipBtn{
    position:fixed;top:20px;right:22px;z-index:70;
    font-size:13px;font-weight:600;color:var(--ink3);
    padding:8px 14px;border:1px solid var(--line2);border-radius:999px;
    background:rgba(255,253,247,.7);backdrop-filter:blur(4px);
    transition:color .2s,border-color .2s;
  }
  #skipBtn:hover{color:var(--ink);border-color:var(--ink3)}
  #skipBtn[hidden]{display:none}

  /* ---------- 등장 ---------- */
  .reveal{opacity:0;transform:translateY(22px);transition:opacity .8s ease,transform .9s cubic-bezier(.16,.84,.3,1)}
  .reveal.on{opacity:1;transform:none}

  /* ---------- 검색 ---------- */
  .searchbar{display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--ink);padding:10px 2px}
  .searchbar input{
    flex:1;min-width:0;background:transparent;border:0;outline:none;
    font-size:clamp(17px,2.2vw,22px);font-weight:600;color:var(--ink);padding:6px 2px;
  }
  .searchbar input::placeholder{color:#A99F8D;font-weight:500}
  .searchbar button{
    flex:none;background:var(--ink);color:var(--paper2);font-weight:700;font-size:15px;
    padding:11px 22px;border-radius:999px;transition:background .2s,transform .15s;
  }
  .searchbar button:hover{background:var(--accent)}
  .searchbar button:active{transform:scale(.97)}
  .searchbar.compact{border-bottom-width:1px;border-color:var(--line2)}
  .searchbar.compact input{font-size:16px}
  .searchbar.compact button{padding:9px 18px;font-size:14px}

  .chip{
    border:1px solid var(--line2);border-radius:999px;padding:9px 16px;
    font-size:14px;font-weight:600;color:var(--ink2);background:var(--paper2);
    transition:border-color .18s,color .18s,background .18s,transform .18s;
  }
  .chip:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}

  /* ---------- 카드 ---------- */
  .card{
    background:var(--paper2);border:1px solid var(--line);border-radius:14px;
    padding:26px 26px 22px;text-align:left;width:100%;display:flex;flex-direction:column;
    transition:transform .25s cubic-bezier(.16,.84,.3,1),box-shadow .25s,border-color .25s;
    box-shadow:0 1px 0 rgba(34,31,26,.03);
  }
  .card:hover{transform:translateY(-4px);border-color:var(--line2);box-shadow:0 14px 34px -18px rgba(34,31,26,.34)}
  .card-enter{opacity:0;transform:translateY(24px)}
  .card-enter.on{opacity:1;transform:none;transition:opacity .6s ease,transform .7s cubic-bezier(.16,.84,.3,1)}

  .reason{
    background:var(--accent-soft);border-left:3px solid var(--accent);
    border-radius:0 10px 10px 0;padding:14px 16px;margin-top:18px;
  }
  .reason-label{
    display:inline-flex;align-items:center;gap:7px;
    font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--accent);margin-bottom:7px;
  }
  .reason-label i{width:6px;height:6px;background:var(--accent);border-radius:1px;display:inline-block;transform:rotate(45deg)}
  .reason p{font-size:15px;line-height:1.62;color:#5C2A1B;font-weight:600;margin:0}

  .badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;white-space:nowrap}
  .badge-none{background:#E7F0E9;color:#2C6349}
  .badge-some{background:#F7EBD6;color:#855314}
  .badge-much{background:#F7E2E1;color:#8C3129}
  .badge i{width:6px;height:6px;border-radius:999px;background:currentColor;display:inline-block}

  .tag{font-size:12px;font-weight:600;color:var(--ink3);background:#F1ECE0;border-radius:6px;padding:4px 9px}

  /* ---------- 스켈레톤 ---------- */
  .sk{background:linear-gradient(90deg,#EFE9DC 0%,#F6F2E8 50%,#EFE9DC 100%);background-size:220% 100%;
      animation:shimmer 1.4s linear infinite;border-radius:6px}
  @keyframes shimmer{0%{background-position:120% 0}100%{background-position:-120% 0}}

  /* ---------- 타임라인 ---------- */
  .tl{position:relative;padding-left:38px;margin:0;list-style:none}
  .tl::before{content:'';position:absolute;left:9px;top:8px;bottom:24px;width:2px;background:var(--line2);border-radius:2px}
  .tl-fill{position:absolute;left:9px;top:8px;width:2px;height:0;background:var(--accent);border-radius:2px;transition:height .14s linear}
  .tl-item{position:relative;padding-bottom:38px;opacity:0;transform:translateY(18px);
           transition:opacity .65s ease,transform .8s cubic-bezier(.16,.84,.3,1)}
  .tl-item.in{opacity:1;transform:none}
  .tl-dot{position:absolute;left:-38px;top:2px;width:20px;height:20px;border-radius:999px;
          background:var(--paper);border:2px solid var(--line2);display:grid;place-items:center;
          transition:border-color .5s ease,transform .5s cubic-bezier(.16,.84,.3,1)}
  .tl-dot::after{content:'';width:8px;height:8px;border-radius:999px;background:var(--line2);transition:background .5s ease}
  .tl-item.in .tl-dot{border-color:var(--accent);transform:scale(1.06)}
  .tl-item.in .tl-dot::after{background:var(--accent)}

  /* ---------- 인용 ---------- */
  .quote{
    background:#F1ECDF;border-radius:14px;padding:30px 30px 26px;position:relative;
  }
  .quote::before{
    content:'\201C';position:absolute;top:2px;left:20px;font-size:88px;line-height:1;
    color:var(--line2);font-family:Georgia,serif;
  }
  .quote p{position:relative;font-size:clamp(18px,2.5vw,23px);line-height:1.66;font-weight:700;color:#3A342B;margin:0}

  .sec-title{font-size:13px;font-weight:800;letter-spacing:.1em;color:var(--accent);margin-bottom:12px}
  .body-text{font-size:16.5px;line-height:1.85;color:var(--ink2)}

  .btn-primary{background:var(--ink);color:var(--paper2);font-weight:700;padding:16px 22px;border-radius:12px;
               transition:background .2s,transform .15s;text-align:center}
  .btn-primary:hover{background:var(--accent)}
  .btn-primary:active{transform:scale(.985)}
  .btn-ghost{border:1px solid var(--line2);color:var(--ink2);font-weight:700;padding:16px 22px;border-radius:12px;
             transition:border-color .2s,color .2s;text-align:center}
  .btn-ghost:hover{border-color:var(--ink);color:var(--ink)}

  /* ---------- 토스트 ---------- */
  #toast{
    position:fixed;left:50%;bottom:34px;transform:translate(-50%,18px);z-index:80;
    background:var(--ink);color:var(--paper2);font-size:14.5px;font-weight:600;
    padding:14px 22px;border-radius:999px;opacity:0;pointer-events:none;
    transition:opacity .28s ease,transform .35s cubic-bezier(.16,.84,.3,1);
    box-shadow:0 16px 40px -16px rgba(34,31,26,.5);max-width:88vw;text-align:center;
  }
  #toast.on{opacity:1;transform:translate(-50%,0)}

  /* ---------- 부모 전용 페이지 ---------- */
  .parent-view{background:#FFFDF6;color:#1F1C17}
  .parent-view .p-body{font-size:21px;line-height:2.05;color:#38332B}
  .parent-view h1{font-size:clamp(34px,5.4vw,48px);line-height:1.32;font-weight:800;letter-spacing:-0.035em}
  .parent-view h2{font-size:clamp(24px,3.4vw,30px);font-weight:800;letter-spacing:-0.03em;line-height:1.4}
  .gloss{color:#7A5A3C;font-weight:600;font-size:.86em}
  .p-card{background:#FFFFFF;border:1px solid #E8E0CE;border-radius:16px;padding:34px 32px}
  .p-step{display:flex;gap:20px;padding:22px 0;border-bottom:1px solid #EFE8D8}
  .p-step:last-child{border-bottom:0}
  .p-year{flex:none;width:120px;font-size:19px;font-weight:800;color:#8A6A3E}

  @media (max-width:640px){
    .p-step{flex-direction:column;gap:6px}
    .p-year{width:auto}
    .quote{padding:26px 22px 22px}
    .quote::before{font-size:66px;left:14px}
  }

  /* ---------- 접근성 ---------- */
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{
      animation-duration:.001ms !important;animation-iteration-count:1 !important;
      transition-duration:.001ms !important;
    }
    .reveal,.card-enter,.tl-item{opacity:1 !important;transform:none !important}
    .intro-line{opacity:1;transform:none}
  }
</style>
</head>
<body>

<button id="skipBtn" hidden>인트로 건너뛰기</button>
<div id="introOverlay" hidden><div class="intro-line" id="introLine"></div></div>

<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>

<script>

const MODEL   = "claude-sonnet-4-6";

  ],

function normalize(s){ return (s||"").toLowerCase().replace(/[\s.,!?"'“”‘’·~\-—()]/g, ""); }

function expandTokens(q){
  const raw = (q||"").toLowerCase();
  const set = new Set();
  Object.keys(SYNONYMS).forEach(k => {
    const group = SYNONYMS[k];
    // 키뿐 아니라 그룹 안의 표현("미대","체대" 등)이 걸려도 그룹 전체를 펼친다
    if (raw.includes(k) || group.some(v => raw.includes(v))) group.forEach(v => set.add(v));
  });
  raw.split(/[\s,.!?]+/).forEach(t => { if (t.length >= 2) set.add(t); });
  return [...set];
}

function firstSentence(text){
  const m = (text||"").match(/“([^”]{4,60})”/);
  if (m) return m[1];
  const s = (text||"").split(/(?<=[.!?])\s/)[0] || "";
  return s.length > 60 ? s.slice(0, 58) + "…" : s;
}

function templateReason(p){
  return "이분도 부모님께 “" + firstSentence(p.parentWords) + "”라는 말을 들으셨고, 지금은 " +
         p.currentJob + "로 일하고 계십니다.";
}

/* 키워드 매칭 폴백 */
function keywordSearch(q){
  const tokens = expandTokens(q);
  const scored = PEOPLE.map(p => {
    let score = 0;
    const tagBlob  = p.routeTags.join(" ").toLowerCase() + " " + p.routeSummary.toLowerCase() + " " + p.currentJob.toLowerCase();
    const wordBlob = (p.parentWords + " " + p.howItWent + " " + p.parentNow + " " + p.regret.text).toLowerCase();
    tokens.forEach(t => {
      if (tagBlob.includes(t))  score += 3;
      if (wordBlob.includes(t)) score += 2;
    });
    return { p, score: score + Math.random() * 0.5 };
  });
  scored.sort((a, b) => b.score - a.score);
  let top = scored.slice(0, 3).map(s => s.p);
  if (scored[0].score < 1.6) {                       // 아무것도 안 걸리면 대표 3인
    top = ["p01", "p09", "p07"].map(id => BY_ID[id]);
  }
  return top.map(p => ({ id: p.id, reason: templateReason(p) }));
}

function fallbackSearch(q){
  const nq = normalize(q);
  const preset = PRESETS.find(pr => {
    const np = normalize(pr.q);
    return nq === np || nq.includes(np) || np.includes(nq);
  });
  if (preset) return preset.results.slice();
  return keywordSearch(q);
}

    '{"results":[{"id":"p01","reason":"..."},{"id":"p02","reason":"..."},{"id":"p03","reason":"..."}]}'
  ].join("\n");
}

function stripFence(text){
  return (text || "")
    .replace(/```json/gi, "")
    .replace(/```/g, "")
    .trim();
}

async function aiSearch(q){
  if (!API_KEY) return { results: fallbackSearch(q), source: "fallback" };

  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 8000);   // 타임아웃 8초
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      signal: controller.signal,
      headers: {
        "content-type": "application/json",
        "x-api-key": API_KEY,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: MODEL,
        max_tokens: 1000,
        messages: [{ role: "user", content: buildPrompt(q) }]
      })
    });
    if (!res.ok) throw new Error("http " + res.status);

    const data = await res.json();
    const text = (data.content || []).map(b => b.text || "").join("");
    const parsed = JSON.parse(stripFence(text));

    const results = (parsed.results || [])
      .filter(r => r && BY_ID[r.id] && typeof r.reason === "string" && r.reason.trim())
      .slice(0, 3);
    if (results.length < 3) throw new Error("not enough results");

    return { results, source: "ai" };
  } catch (e) {
    return { results: fallbackSearch(q), source: "fallback" };   // UI에는 아무 에러도 안 보인다
  } finally {
    clearTimeout(timer);
  }
}

function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

let toastTimer = null;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("on"), 2600);
}

    const wait = Math.max(0, 3400 - (Date.now() - started));   // 로딩 문구를 다 보여준다
    setTimeout(() => { clearInterval(rotate); paint(results); }, REDUCED ? 0 : wait);

    clearInterval(rotate);
    if (token !== renderToken) return;          // 이미 다른 화면으로 넘어갔다

function initTimeline(){
  if (tlCleanup) { tlCleanup(); tlCleanup = null; }

  const tl   = document.getElementById("timeline");
  const fill = document.getElementById("tlFill");
  if (!tl || !fill) return;

  const items = [...tl.querySelectorAll(".tl-item")];

  if (REDUCED) {
    items.forEach(i => i.classList.add("in"));
    fill.style.height = "100%";
    return;
  }

  /* 노드가 순차로 나타난다 */
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        const i = items.indexOf(e.target);
        setTimeout(() => e.target.classList.add("in"), Math.min(i, 3) * 90);
        io.unobserve(e.target);
      }
    });
  }, { rootMargin: "0px 0px -18% 0px", threshold: 0.15 });
  items.forEach(i => io.observe(i));

  /* 선이 위에서 아래로 그려진다 */
  let ticking = false;
  function update(){
    ticking = false;
    const r    = tl.getBoundingClientRect();
    const line = tl.offsetHeight - 32;
    const mark = window.innerHeight * 0.62;
    const prog = Math.max(0, Math.min(1, (mark - r.top) / Math.max(1, r.height)));
    fill.style.height = Math.round(line * prog) + "px";
  }
  function onScroll(){
    if (!ticking) { ticking = true; requestAnimationFrame(update); }
  }
  window.addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("resize", onScroll);
  update();

  tlCleanup = () => {
    io.disconnect();
    window.removeEventListener("scroll", onScroll);
    window.removeEventListener("resize", onScroll);
  };
}

function plainify(text){
  let out = esc(text);
  const used = [];
  GLOSS_KEYS.forEach(k => {
    const ek = esc(k);
    const at = out.indexOf(ek);
    if (at === -1) return;
    if (used.some(u => ek.includes(u) || u.includes(ek))) return;   // 겹치는 용어는 한 번만
    used.push(ek);
    out = out.slice(0, at) + ek + '<span class="gloss">(' + esc(GLOSSARY[k]) + ")</span>" + out.slice(at + ek.length);
  });
  return out;
}

      '<p class="p-body mt-4" style="color:#6B6255">한 사람의 이야기일 뿐, 정답은 아닙니다.<br/>다만 이런 길을 걸어간 사람이 실제로 있다는 것만 전하고 싶었다고 합니다.</p>' +
      '<div class="mt-9 flex flex-wrap gap-3">' +
        '<a href="#/person/' + p.id + '" style="font-size:19px;font-weight:800;color:#8A5A2B;text-decoration:underline;text-underline-offset:6px">원래 화면으로 돌아가기</a>' +
      "</div>" +
    "</div>" +

  "</div>";
}

/* ============================================================
   라우터
   ============================================================ */
function parseHash(){
  const raw = (location.hash || "#/").slice(1) || "/";
  const qi   = raw.indexOf("?");
  const path = qi === -1 ? raw : raw.slice(0, qi);
  const qs   = qi === -1 ? ""  : raw.slice(qi + 1);
  return { path, params: new URLSearchParams(qs) };
}

function route(){
  renderToken++;
  if (tlCleanup) { tlCleanup(); tlCleanup = null; }
  document.body.classList.remove("parent-view");

  const { path, params } = parseHash();
  const seg = path.split("/").filter(Boolean);

  if (path === "/" || seg.length === 0) {
    renderLanding();
  } else if (seg[0] === "search") {
    const q = (params.get("q") || "").trim();
    if (!q) { go("/"); return; }
    clearIntro(); introDone = true;
    document.getElementById("introOverlay").hidden = true;
    document.getElementById("skipBtn").hidden = true;
    renderSearch(q);
  } else if (seg[0] === "person" && seg[1]) {
    clearIntro(); introDone = true;
    document.getElementById("introOverlay").hidden = true;
    document.getElementById("skipBtn").hidden = true;
    renderPerson(seg[1]);
  } else if (seg[0] === "parent" && seg[1]) {
    clearIntro(); introDone = true;
    document.getElementById("introOverlay").hidden = true;
    document.getElementById("skipBtn").hidden = true;
    renderParent(seg[1]);
  } else {
    go("/");
    return;
  }
  window.scrollTo({ top: 0, behavior: "auto" });
}

document.getElementById("skipBtn").addEventListener("click", endIntro);
window.addEventListener("hashchange", route);
route();
</script>
