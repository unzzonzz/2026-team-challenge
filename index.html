<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>별의별 — 먼저 간 사람들</title>
<meta name="description" content="부모님이 반대할 때, 그 길을 이미 걸어본 사람의 이야기를 찾아주는 곳." />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          paper:  '#F8F3E8',
          paper2: '#FFFDF7',
          paper3: '#F1EBDD',
          ink:    '#171717',
          ink2:   '#383838',
          ink3:   '#6E6A62',
          line:   '#EDE4D2',
          line2:  '#DFD4BE',
          accent: '#7A4E9E',
          pink:   '#F3A7D0',
          yellow: '#F6D96A',
          purple: '#A986D4',
          blue:   '#9DBDE8',
          green:  '#9DB66A',
          orange: '#F5A13B'
        }
      }
    }
  }
</script>
<style>
  :root{
    --header-h:68px;
    /* surface — 따뜻한 아이보리. 순백은 쓰지 않는다 */
    --paper:#F8F3E8;
    --paper2:#FFFDF7;
    --paper3:#F1EBDD;
    /* ink — 화면을 잡아주는 앵커 역할만 */
    --ink:#171717;
    --ink2:#383838;
    --ink3:#6E6A62;
    --line:#EDE4D2;
    --line2:#DFD4BE;
    /* accent — 파스텔은 대비가 부족해 텍스트에는 진한 톤을 쓴다 */
    --accent:#7A4E9E;
    --accent-soft:#EFE7F7;
    /* pastel — 배경·장식·구분용 */
    --pink:#F3A7D0;   --pink-soft:#F9DCEB;
    --yellow:#F6D96A; --yellow-soft:#FBEFC4;
    --purple:#A986D4; --purple-soft:#E5DAF4;
    --blue:#9DBDE8;   --blue-soft:#DDE8F7;
    --green:#9DB66A;  --green-soft:#E2EBCE;
    --orange:#F5A13B; --orange-soft:#FBE3C4;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  html{scroll-behavior:smooth}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    letter-spacing:-0.021em;
    word-break:keep-all;
    overflow-wrap:break-word;
  }
  ::selection{background:var(--accent);color:#fff}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;letter-spacing:inherit}
  input{font:inherit;letter-spacing:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}

  /* ---------- 공용 ---------- */
  .wrap{width:100%;max-width:1080px;margin:0 auto;padding:0 24px}
  .wrap-narrow{width:100%;max-width:760px;margin:0 auto;padding:0 24px}
  .hairline{height:1px;background:var(--line);border:0}
  .kicker{font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--ink3);text-transform:uppercase}
  .serifnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

  .brand{display:inline-flex;align-items:baseline;gap:8px;font-weight:800;font-size:19px;letter-spacing:-0.03em}
  .brand small{font-size:12px;font-weight:600;color:var(--ink3);letter-spacing:.06em}
  .brand{gap:9px}
  .brand-star{width:30px;height:30px;flex:none;display:inline-block;
              transition:transform .7s var(--ease)}
  .brand:hover .brand-star{transform:rotate(-12deg) scale(1.08)}
  .brand b{font-weight:800}
  .brand .b1{color:var(--purple)}
  .brand .b2{color:var(--ink)}
  .brand .b3{color:var(--pink)}

  /* ---------- 인트로 ---------- */
  #introOverlay{
    position:fixed;inset:0;z-index:60;background:var(--paper);
    display:grid;place-items:center;padding:24px;overflow:hidden;
    transition:opacity .75s ease;
  }
  #introOverlay::before,#introOverlay::after{content:'';position:absolute;border-radius:50%;
    filter:blur(2px);opacity:.5;animation:floaty 9s ease-in-out infinite}
  #introOverlay::before{width:220px;height:220px;background:var(--purple-soft);left:-60px;top:12%}
  #introOverlay::after{width:180px;height:180px;background:var(--pink-soft);right:-50px;bottom:14%;
    animation-delay:-4s}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-26px)}}
  #introOverlay.gone{opacity:0;pointer-events:none}
  .intro-line{
    max-width:1000px;text-align:center;font-weight:800;
    font-size:clamp(30px,6.4vw,62px);line-height:1.24;letter-spacing:-0.04em;
    color:var(--ink);
    opacity:0;transform:translateY(16px) scale(.985);
    transition:opacity .55s ease,transform .75s cubic-bezier(.22,1,.36,1);
  }
  .intro-line.show{opacity:1;transform:none}
  #skipBtn{
    position:fixed;top:20px;right:22px;z-index:70;
    font-size:13px;font-weight:600;color:var(--ink3);
    padding:9px 16px;border:1px solid transparent;border-radius:999px;background:var(--paper2);
    background:rgba(255,253,247,.75);backdrop-filter:blur(4px);
    transition:color .2s,border-color .2s;
  }
  #skipBtn:hover{color:var(--ink);border-color:var(--ink3)}
  #skipBtn[hidden]{display:none}

  /* ---------- 등장 ---------- */
  .reveal{opacity:0;transform:translateY(22px);transition:opacity .8s ease,transform .9s cubic-bezier(.22,1,.36,1)}
  .reveal.on{opacity:1;transform:none}

  /* ---------- 검색 ---------- */
  .searchbar{display:flex;align-items:center;gap:8px;background:var(--paper2);
    border:1px solid transparent;border-radius:999px;padding:7px 7px 7px 22px;
    box-shadow:0 6px 20px rgba(40,30,20,.05);
    transition:border-color .3s var(--ease),box-shadow .3s var(--ease)}
  .searchbar:focus-within{border-color:var(--purple);box-shadow:0 10px 28px rgba(122,78,158,.14)}
  .searchbar input{
    flex:1;min-width:0;background:transparent;border:0;outline:none;
    font-size:clamp(15.5px,1.5vw,18px);font-weight:600;color:var(--ink);padding:10px 0;
  }
  .searchbar input::placeholder{color:#6B675C;font-weight:600}
  .searchbar button{
    flex:none;background:var(--accent);color:var(--paper2);font-weight:800;font-size:14.5px;
    padding:12px 24px;border-radius:999px;transition:background .25s,transform .35s var(--ease);
  }
  .searchbar button:hover{background:var(--ink);transform:translateY(-1px)}
  .searchbar button:active{transform:scale(.97)}
  .searchbar.compact{padding:5px 5px 5px 18px}
  .searchbar.compact input{font-size:15px;padding:8px 0}
  .searchbar.compact button{padding:9px 18px;font-size:13.5px}

  .chip{
    border:1px solid transparent;border-radius:999px;padding:10px 17px;
    font-size:13.5px;font-weight:700;color:var(--ink2);background:var(--paper2);
    box-shadow:0 3px 12px rgba(40,30,20,.04);
    transition:color .25s,background .25s,transform .4s var(--ease);
  }

  /* ---------- 카드 ---------- */
  .card{
    background:var(--paper2);border:1px solid var(--line);border-radius:26px 26px 26px 60px;
    padding:26px 26px 22px;text-align:left;width:100%;display:flex;flex-direction:column;
    transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .25s,border-color .25s;
    box-shadow:0 8px 25px rgba(40,30,20,.05);
  }
  /* 카드마다 형태를 조금씩 다르게 준다 */
  .card:nth-child(3n+2){border-radius:26px 60px 26px 26px}
  .card:nth-child(3n+3){border-radius:60px 26px 26px 26px}
  .card:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:0 14px 34px rgba(40,30,20,.09)}
  .card-enter{opacity:0;transform:translateY(24px)}
  .card-enter.on{opacity:1;transform:none;transition:opacity .6s ease,transform .7s cubic-bezier(.22,1,.36,1)}

  .reason{
    background:var(--accent-soft);border-left:3px solid var(--accent);
    border-radius:0 18px 18px 0;padding:16px 18px;margin-top:18px;
  }
  .reason-label{
    display:inline-flex;align-items:center;gap:7px;
    font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--accent);margin-bottom:7px;
  }
  .reason-label i{width:7px;height:7px;background:var(--accent);border-radius:50% 50% 50% 2px;display:inline-block}
  .reason p{font-size:15px;line-height:1.62;color:#4A2E63;font-weight:600;margin:0}

  .badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;white-space:nowrap}
  .badge-none{background:var(--green-soft);color:#4A5C2A}
  .badge-some{background:var(--yellow-soft);color:#7A5A16}
  .badge-much{background:var(--pink-soft);color:#8E3763}
  .badge i{width:6px;height:6px;border-radius:999px;background:currentColor;display:inline-block}

  .tag{font-size:12px;font-weight:700;color:var(--ink2);background:var(--paper3);border-radius:999px;padding:5px 11px}

  /* ---------- 스켈레톤 ---------- */
  .sk{background:linear-gradient(90deg,#EAE2F0 0%,#F7F3EA 50%,#EAE2F0 100%);background-size:220% 100%;
      animation:shimmer 1.4s linear infinite;border-radius:6px}
  @keyframes shimmer{0%{background-position:120% 0}100%{background-position:-120% 0}}

  /* ---------- 타임라인 ---------- */
  .tl{position:relative;padding-left:38px;margin:0;list-style:none}
  .tl::before{content:'';position:absolute;left:9px;top:8px;bottom:24px;width:2px;background:var(--line2);border-radius:2px}
  .tl-fill{position:absolute;left:9px;top:8px;width:2px;height:0;background:var(--accent);border-radius:2px;transition:height .14s linear}
  .tl-item{position:relative;padding-bottom:38px;opacity:0;transform:translateY(18px);
           transition:opacity .65s ease,transform .8s cubic-bezier(.22,1,.36,1)}
  .tl-item.in{opacity:1;transform:none}
  .tl-dot{position:absolute;left:-38px;top:2px;width:20px;height:20px;border-radius:999px;
          background:var(--paper);border:2px solid var(--line2);display:grid;place-items:center;
          transition:border-color .5s ease,transform .5s cubic-bezier(.22,1,.36,1)}
  .tl-dot::after{content:'';width:8px;height:8px;border-radius:999px;background:var(--line2);transition:background .5s ease}
  .tl-item.in .tl-dot{border-color:var(--accent);transform:scale(1.06)}
  .tl-item.in .tl-dot::after{background:var(--accent)}

  /* ---------- 인용 ---------- */
  .quote{
    background:var(--yellow-soft);border-radius:28px 28px 28px 64px;padding:32px 32px 28px;position:relative;
  }
  .quote::before{
    content:'\201C';position:absolute;top:2px;left:20px;font-size:88px;line-height:1;
    color:var(--line2);font-family:Georgia,serif;
  }
  .quote p{position:relative;font-size:clamp(18px,2.5vw,23px);line-height:1.66;font-weight:700;color:#3A342B;margin:0}

  .sec-title{font-size:13px;font-weight:800;letter-spacing:.1em;color:var(--accent);margin-bottom:12px}
  .body-text{font-size:16.5px;line-height:1.85;color:var(--ink2)}

  .btn-primary{background:var(--ink);color:var(--paper2);font-weight:700;padding:16px 24px;border-radius:999px;
               transition:background .2s,transform .15s;text-align:center}
  .btn-primary:hover{background:var(--accent)}
  .btn-primary:active{transform:scale(.985)}
  .btn-ghost{border:1px solid var(--line2);color:var(--ink2);font-weight:700;padding:16px 24px;border-radius:999px;
             transition:border-color .2s,color .2s;text-align:center}
  .btn-ghost:hover{border-color:var(--ink);color:var(--ink)}

  /* ---------- 토스트 ---------- */
  #toast{
    position:fixed;left:50%;bottom:34px;transform:translate(-50%,18px);z-index:80;
    background:var(--ink);color:var(--paper2);font-size:14.5px;font-weight:700;
    padding:14px 24px;border-radius:999px;opacity:0;pointer-events:none;
    transition:opacity .28s ease,transform .35s cubic-bezier(.22,1,.36,1);
    box-shadow:0 14px 36px rgba(40,30,20,.22);max-width:88vw;text-align:center;
  }
  #toast.on{opacity:1;transform:translate(-50%,0)}

  /* ---------- 부모 전용 페이지 ---------- */
  .parent-view{background:#FFFDF6;color:#1F1C17}
  .parent-view .p-body{font-size:21px;line-height:2.05;color:#38332B}
  .parent-view h1{font-size:clamp(34px,5.4vw,48px);line-height:1.32;font-weight:800;letter-spacing:-0.035em}
  .parent-view h2{font-size:clamp(24px,3.4vw,30px);font-weight:800;letter-spacing:-0.03em;line-height:1.4}
  .gloss{color:#7A5A3C;font-weight:600;font-size:.86em}
  .p-card{background:#FFFFFF;border:1px solid #E8E0CE;border-radius:34px;padding:36px 34px}
  .p-step{display:flex;gap:20px;padding:22px 0;border-bottom:1px solid #EFE8D8}
  .p-step:last-child{border-bottom:0}
  .p-year{flex:none;width:120px;font-size:19px;font-weight:800;color:#8A6A3E}

  @media (max-width:640px){
    .p-step{flex-direction:column;gap:6px}
    .p-year{width:auto}
    .quote{padding:26px 22px 22px}
    .quote::before{font-size:66px;left:14px}
  }

  /* ---------- 랜딩 롱스크롤 ---------- */
  /* 스냅은 랜딩에서만 켠다. proximity라 긴 섹션에 갇히지 않는다. */
  html.snap{scroll-snap-type:y proximity}
  html.snap .sec{scroll-snap-align:start}
  html.snap footer{scroll-snap-align:end}
  @media (min-width:900px) and (min-height:700px){
    html.snap{scroll-snap-type:y mandatory}
  }

  .sec{min-height:88vh;display:flex;align-items:center;padding:96px 0;position:relative}
  /* 히어로만 [헤더 자리 / 본문] 2단으로 쪼갠다. 로고가 실제로 높이를 차지하므로
     본문이 그 아래로 파고들 수 없다. */
  .sec-hero{min-height:100vh;flex-direction:column;align-items:stretch;padding-top:0;padding-bottom:0}
  .hero-head{flex:none;height:var(--header-h);display:flex;align-items:center}
  .hero-body{flex:1 1 auto;display:flex;align-items:center;padding-bottom:clamp(78px,11vh,116px);min-height:0}
  @media (max-width:640px){
    :root{--header-h:58px}
    .hero-body{padding-bottom:82px}
  }
  .sec-lead{font-size:12px;font-weight:800;letter-spacing:.16em;color:var(--ink3);margin-bottom:18px}
  .sec-h{font-weight:800;letter-spacing:-0.04em;line-height:1.26;font-size:clamp(27px,4.4vw,46px)}
  .sec-note{font-size:clamp(15px,1.9vw,19px);font-weight:700;color:var(--ink2);line-height:1.6}

  .rise{opacity:0;transform:translateY(26px);transition:opacity .75s ease,transform .85s cubic-bezier(.22,1,.36,1)}
  .rise.in{opacity:1;transform:none}

  /* 섹션 인디케이터 */
  #dots{position:fixed;right:22px;top:50%;transform:translateY(-50%);z-index:45;display:flex;flex-direction:column;gap:13px}
  #dots button{width:9px;height:9px;border-radius:999px;background:var(--line2);padding:0;
               transition:background .3s,transform .3s;position:relative}
  #dots button:hover{background:var(--ink3)}
  #dots button[aria-current="true"]{background:var(--accent);transform:scale(1.45)}
  #dots button span{position:absolute;right:18px;top:50%;transform:translateY(-50%);white-space:nowrap;
    font-size:11.5px;font-weight:700;color:var(--ink3);opacity:0;pointer-events:none;transition:opacity .2s}
  #dots button:hover span{opacity:1}
  @media (max-width:900px){#dots{display:none}}

  /* 스크롤 유도 */
  .scroll-cue{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);
              display:flex;flex-direction:column;align-items:center;gap:9px;color:var(--ink3)}
  .scroll-cue i{display:block;width:1px;height:34px;background:var(--line2);position:relative;overflow:hidden}
  .scroll-cue i::after{content:'';position:absolute;inset:0;background:var(--accent);
                       animation:cue 1.9s cubic-bezier(.6,.05,.3,1) infinite}
  @keyframes cue{0%{transform:translateY(-100%)}60%,100%{transform:translateY(100%)}}
  /* 낮은 발표 화면: 인디케이터를 접고 헤더·여백을 줄여 히어로가 한 화면에 들어오게 한다.
     .scroll-cue 정의 뒤에 와야 display:none이 이긴다. */
  @media (max-height:680px){
    :root{--header-h:54px}
    .scroll-cue{display:none}
    .hero-body{padding-bottom:10px}
    #heroStage > .reveal:last-child{margin-top:20px}
  }

  /* S2 마퀴 */
  .mq{overflow:hidden;position:relative;padding:7px 0}
  .mq-track{display:flex;gap:14px;width:max-content;animation:mq linear infinite}
  .mq:hover .mq-track{animation-play-state:paused}
  @keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .mq-rev .mq-track{animation-direction:reverse}
  .mq-card{flex:none;background:var(--paper2);border:1px solid var(--line);border-radius:999px;
           padding:12px 22px;font-size:14.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
  .mq-mask{position:relative}
  .mq-mask::before,.mq-mask::after{content:'';position:absolute;top:0;bottom:0;width:16%;z-index:2;pointer-events:none}
  .mq-mask::before{left:0;background:linear-gradient(90deg,var(--paper),transparent)}
  .mq-mask::after{right:0;background:linear-gradient(270deg,var(--paper),transparent)}

  /* S3 진짜 이유 */
  .why-item{font-size:clamp(19px,2.6vw,27px);font-weight:700;line-height:1.5;color:var(--ink2)}

  /* S4 AI vs 사람 */
  .vs-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch}
  .vs-cell{border-radius:20px;padding:20px 22px;font-size:clamp(15px,2vw,19px);font-weight:700;line-height:1.45}
  .vs-ai{background:var(--paper3);color:#807868}
  .vs-hu{background:var(--purple-soft);color:#4A2E63;border-left:3px solid var(--accent)}
  .vs-head{font-size:12px;font-weight:800;letter-spacing:.1em;padding:0 4px 10px}

  /* S5 미니 목업 */
  .mock{background:var(--paper2);border:1px solid var(--line);border-radius:26px;padding:20px;
        height:206px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;position:relative}
  .mock-bar{display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--ink);padding-bottom:9px}
  .mock-bar span{font-size:13.5px;font-weight:700;color:var(--ink)}
  .caret{display:inline-block;width:2px;height:15px;background:var(--accent);vertical-align:-2px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .grid30{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
  .g-cell{height:17px;border-radius:5px;background:var(--paper3);transition:background .35s ease,transform .35s ease}
  .g-cell.hit{background:var(--accent);transform:scale(1.12)}
  .scanline{position:absolute;left:0;right:0;height:2px;background:var(--accent);opacity:0;box-shadow:0 0 12px rgba(168,67,43,.5)}
  .scanline.run{animation:scan 1.5s cubic-bezier(.4,0,.4,1) forwards}
  @keyframes scan{0%{opacity:.9;top:12%}92%{opacity:.9}100%{opacity:0;top:88%}}
  .mock-res{border:1px solid var(--line);border-radius:16px;padding:11px 13px;background:var(--paper)}
  .step-n{font-size:11.5px;font-weight:800;letter-spacing:.1em;color:var(--accent)}
  .step-arrow{display:grid;place-items:center;color:var(--line2);font-size:22px}
  .step-grid{display:grid;gap:16px;align-items:stretch;grid-template-columns:1fr auto 1fr auto 1fr}
  @media (max-width:900px){
    .step-grid{grid-template-columns:1fr}
    .step-arrow{transform:rotate(90deg);padding:2px 0}
  }

  /* S6 미니 타임라인 */
  .mini-tl{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .mini-node{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--ink2)}
  .mini-node b{width:7px;height:7px;border-radius:999px;background:var(--accent);display:inline-block;flex:none}
  .mini-sep{color:var(--line2);font-size:12px}

  /* S7 후회 차트 */
  .bar-wrap{display:flex;align-items:flex-end;gap:clamp(14px,4vw,44px);height:250px}
  .bar-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
  .bar{width:100%;max-width:120px;border-radius:22px 22px 8px 8px;height:0;transition:none}

  .ex-head{text-align:center;max-width:60ch;margin:0 auto}

            aspect-ratio:16/11;min-height:520px}

  @media (max-width:900px){

  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto}
    html.snap{scroll-snap-type:none}

      animation-duration:.001ms !important;animation-iteration-count:1 !important;
      transition-duration:.001ms !important;
    }

  }
</style>

];
const RANKED_GROUPS = ROUTE_GROUPS.slice().sort((a, b) => a.rank - b.rank);
function groupOf(p){
  const hit = RANKED_GROUPS.find(g => p.routeTags.includes(g.tag));
  return hit ? hit.tag : null;
}
function routeCount(tag){ return PEOPLE.filter(p => groupOf(p) === tag).length; }
function regretCounts(){
  const c = { "없음":0, "일부 있음":0, "많이 있음":0 };
  PEOPLE.forEach(p => { c[p.regret.level]++; });
  return c;
}

function objectionsFor(p){
  const mine = OBJECTIONS.filter(o => o.tags.some(t => t !== "*" && p.routeTags.includes(t)));
  const common = OBJECTIONS.filter(o => o.tags.includes("*"));
  const picked = mine.slice(0, 2).concat(common.slice(0, 2));
  // 항상 4개를 채운다
  for (const o of OBJECTIONS){ if (picked.length >= 4) break; if (!picked.includes(o)) picked.push(o); }
  return picked.slice(0, 4);
}

function normalize(s){ return (s||"").toLowerCase().replace(/[\s.,!?"'“”‘’·~\-—()]/g, ""); }

function expandTokens(q){
  const raw = (q||"").toLowerCase();
  const set = new Set();
  Object.keys(SYNONYMS).forEach(k => {
    const group = SYNONYMS[k];
    // 키뿐 아니라 그룹 안의 표현("미대","체대" 등)이 걸려도 그룹 전체를 펼친다
    if (raw.includes(k) || group.some(v => raw.includes(v))) group.forEach(v => set.add(v));
  });
  raw.split(/[\s,.!?]+/).forEach(t => { if (t.length >= 2) set.add(t); });
  return [...set];
}

function firstSentence(text){
  const m = (text||"").match(/“([^”]{4,60})”/);
  if (m) return m[1];
  const s = (text||"").split(/(?<=[.!?])\s/)[0] || "";
  return s.length > 60 ? s.slice(0, 58) + "…" : s;
}

function templateReason(p){
  return "이분도 부모님께 “" + firstSentence(p.parentWords) + "”라는 말을 들으셨고, 지금은 " +
         p.currentJob + "로 일하고 계십니다.";
}

/* 키워드 매칭 폴백 */
function keywordSearch(q){
  const tokens = expandTokens(q);
  const scored = PEOPLE.map(p => {
    let score = 0;
    const tagBlob  = p.routeTags.join(" ").toLowerCase() + " " + p.routeSummary.toLowerCase() + " " + p.currentJob.toLowerCase();
    const wordBlob = (p.parentWords + " " + p.howItWent + " " + p.parentNow + " " + p.regret.text).toLowerCase();
    tokens.forEach(t => {
      if (tagBlob.includes(t))  score += 3;
      if (wordBlob.includes(t)) score += 2;
    });
    return { p, score: score + Math.random() * 0.5 };
  });
  scored.sort((a, b) => b.score - a.score);
  let top = scored.slice(0, 3).map(s => s.p);
  if (scored[0].score < 1.6) {                       // 아무것도 안 걸리면 대표 3인
    top = ["p01", "p09", "p07"].map(id => BY_ID[id]);
  }
  return top.map(p => ({ id: p.id, reason: templateReason(p) }));
}

function fallbackSearch(q){
  const nq = normalize(q);
  const preset = PRESETS.find(pr => {
    const np = normalize(pr.q);
    return nq === np || nq.includes(np) || np.includes(nq);
  });
  if (preset) return preset.results.slice();
  return keywordSearch(q);
}

function buildPrompt(q){
  const slim = PEOPLE.map(p => ({

    routeSummary:p.routeSummary, parentWords:p.parentWords,

  }));
  return [

    "",
    JSON.stringify(slim),
    "",

    "",
    "위 30명 중 이 사용자의 상황과 가장 비슷한 3명을 골라라.",
    "경로가 같은 것보다 '부모님이 한 말'과 '겪은 갈등'이 비슷한 것을 우선해라.",
    "각 인물마다 왜 골랐는지 1문장으로 써라.",
    "그 문장은 사용자에게 직접 보여지므로 따뜻하고 구체적이어야 하며, '이분도 ~하셨습니다' 같은 형태로 쓴다.",
    "반드시 아래 JSON만 출력하고 다른 말은 붙이지 마라. 마크다운 코드펜스도 금지.",
    '{"results":[{"id":"p01","reason":"..."},{"id":"p02","reason":"..."},{"id":"p03","reason":"..."}]}'
  ].join("\n");
}

function stripFence(text){
  return (text || "")
    .replace(/```json/gi, "")
    .replace(/```/g, "")
    .trim();
}

async function aiSearch(q){
  if (!API_KEY) return { results: fallbackSearch(q), source: "fallback" };

  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 8000);   // 타임아웃 8초
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      signal: controller.signal,
      headers: {
        "content-type": "application/json",
        "x-api-key": API_KEY,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: MODEL,
        max_tokens: 1000,
        messages: [{ role: "user", content: buildPrompt(q) }]
      })
    });
    if (!res.ok) throw new Error("http " + res.status);

    const data = await res.json();
    const text = (data.content || []).map(b => b.text || "").join("");
    const parsed = JSON.parse(stripFence(text));

    const results = (parsed.results || [])
      .filter(r => r && BY_ID[r.id] && typeof r.reason === "string" && r.reason.trim())
      .slice(0, 3);
    if (results.length < 3) throw new Error("not enough results");

    return { results, source: "ai" };
  } catch (e) {
    return { results: fallbackSearch(q), source: "fallback" };   // UI에는 아무 에러도 안 보인다
  } finally {
    clearTimeout(timer);

const app     = document.getElementById("app");
const toastEl = document.getElementById("toast");
const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

let toastTimer = null;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("on"), 2600);
}

function badge(level){
  const cls = level === "없음" ? "badge-none" : (level === "많이 있음" ? "badge-much" : "badge-some");
  return '<span class="badge ' + cls + '"><i></i>후회 ' + esc(level) + "</span>";
}

function go(hash){ location.hash = hash; }

function searchbarHTML(value, compact){
  return '' +

      '<input name="q" type="search" autocomplete="off" value="' + esc(value || "") + '"' +

        authBarHTML() +

function bindSearchForms(scope){
  bindAuthBar(scope);                       // 헤더·히어로의 계정 버튼도 같이 연결한다
  scope.querySelectorAll("[data-search]").forEach(form => {
    form.addEventListener("submit", e => {
      e.preventDefault();
      const q = form.querySelector('input[name="q"]').value.trim();
      if (!q) return;
      go("/search?q=" + encodeURIComponent(q));
    });
  });
}

/* 등장 애니메이션 */
function playReveal(scope, sel, gap){
  const nodes = scope.querySelectorAll(sel || ".reveal");
  nodes.forEach((n, i) => {
    setTimeout(() => n.classList.add("on"), REDUCED ? 0 : (gap || 90) * i + 40);
  });
}

  "그래서 대학은 안 갈 거야?",

  "네가 뭘 안다고."

];

let introTimers = [];
let introDone   = false;

function clearIntro(){
  introTimers.forEach(clearTimeout);
  introTimers = [];
}

function endIntro(){
  clearIntro();
  introDone = true;
  const ov   = document.getElementById("introOverlay");
  const skip = document.getElementById("skipBtn");
  ov.classList.add("gone");
  skip.hidden = true;
  setTimeout(() => { ov.hidden = true; }, REDUCED ? 0 : 780);
  const stage = document.getElementById("s1");      // scroll-cue까지 포함해서 켠다
  if (stage) playReveal(stage, ".reveal", 160);
}

function runIntro(){
  const ov   = document.getElementById("introOverlay");
  const line = document.getElementById("introLine");
  const skip = document.getElementById("skipBtn");

  if (REDUCED) { ov.hidden = true; introDone = true; const s = document.getElementById("heroStage"); if (s) playReveal(s, ".reveal", 0); return; }

  ov.hidden = false;
  ov.classList.remove("gone");
  skip.hidden = false;
  line.textContent = "";
  line.classList.remove("show");

  let t = 260;
  INTRO_LINES.forEach(text => {
    introTimers.push(setTimeout(() => { line.textContent = text; line.classList.add("show"); }, t));
    introTimers.push(setTimeout(() => { line.classList.remove("show"); }, t + 1250));
    t += 1600;                                   // 각 대사 1.6초
  });
  introTimers.push(setTimeout(endIntro, t + 800)); // 0.8초 정적 후 메인 카피
}

/* ============================================================
   계정 — 데모용 로컬 인증
   백엔드가 없으므로 계정은 이 브라우저의 localStorage에만 저장된다.
   실제 서비스 인증이 아니다. 다만 비밀번호를 평문으로 두지 않으려고
   SHA-256 + 계정별 salt로 해싱해서 보관한다.
   ============================================================ */
const DB_KEY      = "seonrye.users.v1";
const SESSION_KEY = "seonrye.session.v1";
const REQ_KEY     = "seonrye.requests.v1";

function readStore(key, fallback){
  try { return JSON.parse(localStorage.getItem(key)) || fallback; }
  catch (e) { return fallback; }
}
function writeStore(key, value){
  try { localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch (e) { return false; }          // 사생활 보호 모드 등
}

function randomSalt(){
  const a = new Uint8Array(8);
  (crypto.getRandomValues ? crypto : { getRandomValues: arr => arr.forEach((_, i) => arr[i] = Math.floor(Math.random() * 256)) })
    .getRandomValues(a);
  return [...a].map(b => b.toString(16).padStart(2, "0")).join("");
}

async function hashPw(pw, salt){
  const text = salt + "␟" + pw;
  if (window.crypto && crypto.subtle && crypto.subtle.digest) {
    try {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
      return "s256:" + [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
    } catch (e) { /* 아래 폴백 */ }
  }
  let h1 = 0x811c9dc5, h2 = 0x01000193;   // subtle을 못 쓰는 환경용 폴백
  for (let i = 0; i < text.length; i++){
    h1 = Math.imul(h1 ^ text.charCodeAt(i), 16777619) >>> 0;
    h2 = Math.imul(h2 + text.charCodeAt(i) * (i + 1), 2246822519) >>> 0;
  }
  return "fnv:" + h1.toString(16) + h2.toString(16);
}

let currentUser = null;

function loadSession(){
  const email = readStore(SESSION_KEY, null);
  if (!email) { currentUser = null; return; }
  const u = readStore(DB_KEY, []).find(x => x.email === email);
  currentUser = u ? { name: u.name, email: u.email } : null;
}
function isLoggedIn(){ return !!currentUser; }

async function signUp({ name, email, password }){
  const users = readStore(DB_KEY, []);
  if (users.some(u => u.email === email)) return { ok: false, field: "email", msg: "이미 가입된 이메일입니다." };
  const salt = randomSalt();
  users.push({ name, email, salt, hash: await hashPw(password, salt), at: Date.now() });
  if (!writeStore(DB_KEY, users)) return { ok: false, field: "email", msg: "이 브라우저에 저장할 수 없습니다. 사생활 보호 모드인지 확인해 주세요." };
  writeStore(SESSION_KEY, email);
  currentUser = { name, email };
  return { ok: true };
}

async function signIn({ email, password }){
  const u = readStore(DB_KEY, []).find(x => x.email === email);
  if (!u) return { ok: false, field: "email", msg: "가입되지 않은 이메일입니다." };
  if (await hashPw(password, u.salt) !== u.hash) return { ok: false, field: "password", msg: "비밀번호가 맞지 않습니다." };
  writeStore(SESSION_KEY, email);
  currentUser = { name: u.name, email: u.email };
  return { ok: true };
}

function signOut(){
  try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
  currentUser = null;
}

   ============================================================ */
const modalRoot = document.getElementById("modalRoot");
let lastFocused = null;

function openModal(html){
  lastFocused = document.activeElement;
  modalRoot.innerHTML = '<div class="modal-scrim" data-close></div>' +
    '<div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">' +
      '<button class="modal-close" data-close aria-label="닫기">✕</button>' + html +
    "</div>";
  modalRoot.classList.add("on");
  document.body.style.overflow = "hidden";
  const first = modalRoot.querySelector("input, textarea, select, button:not([data-close])");
  if (first) setTimeout(() => first.focus(), 60);
}

function closeModal(){
  modalRoot.classList.remove("on");
  modalRoot.innerHTML = "";
  document.body.style.overflow = "";
  if (lastFocused && lastFocused.focus) lastFocused.focus();
  lastFocused = null;
}

modalRoot.addEventListener("click", e => { if (e.target.closest("[data-close]")) closeModal(); });
document.addEventListener("keydown", e => {
  if (!modalRoot.classList.contains("on")) return;
  if (e.key === "Escape") { closeModal(); return; }
  if (e.key !== "Tab") return;
  const items = [...modalRoot.querySelectorAll('button, input, textarea, select, a[href]')]
    .filter(el => !el.disabled && el.offsetParent !== null);
  if (!items.length) return;
  const first = items[0], last = items[items.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});

/* 폼 헬퍼 */
function fieldHTML(id, label, type, extra){
  const input = type === "textarea"
    ? '<textarea id="' + id + '" ' + (extra || "") + "></textarea>"
    : '<input id="' + id + '" type="' + type + '" ' + (extra || "") + " />";
  return '<div class="field" data-field="' + id + '">' +
           '<label for="' + id + '">' + esc(label) + "</label>" + input +
           '<p class="err" role="alert"></p>' +
         "</div>";
}
function setErr(id, msg){
  const f = modalRoot.querySelector('[data-field="' + id + '"]');
  if (!f) return;
  f.classList.add("invalid");
  f.querySelector(".err").textContent = msg;
  const input = f.querySelector("input, textarea, select");
  if (input) input.focus();
}
function clearErrs(){
  modalRoot.querySelectorAll(".field.invalid").forEach(f => {
    f.classList.remove("invalid");
    f.querySelector(".err").textContent = "";
  });
}
const val = id => (modalRoot.querySelector("#" + id) || {}).value?.trim() || "";
const isEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);

  else if (f.face.mouth === "wave") mouth = '<path d="M39 65q5-5 10 0t10 0" stroke="'+ink+'" stroke-width="3.6" fill="none" stroke-linecap="round"/>';
  else                              mouth = '<rect x="43" y="63" width="14" height="4" rx="2" fill="'+ink+'"/>';
  return '<svg class="fig ' + (cls || "") + '" viewBox="0 0 100 100" width="100%" height="100%" aria-hidden="true">' +
    '<path d="' + SHAPE_D[f.shape] + '" fill="var(--' + f.tone + ')"/>' +
    '<g data-eyes>' + eyes + "</g>" + mouth + "</svg>";
}

/* 눈이 커서를 조금 따라본다 */
const eyePointer = { x:-9999, y:-9999, on:false };
addEventListener("pointermove", e => { eyePointer.x = e.clientX; eyePointer.y = e.clientY; eyePointer.on = true; }, { passive:true });
(function eyeLoop(){
  if (!REDUCED && eyePointer.on){
    document.querySelectorAll("[data-eyes]").forEach(g => {
      const svg = g.ownerSVGElement; if (!svg) return;
      const r = svg.getBoundingClientRect();
      if (!r.width || r.bottom < 0 || r.top > innerHeight) return;
      const dx = Math.max(-1, Math.min(1, (eyePointer.x - (r.left + r.width / 2)) / (r.width * 1.5))) * 3.4;
      const dy = Math.max(-1, Math.min(1, (eyePointer.y - (r.top + r.height / 2)) / (r.height * 1.5))) * 2.8;
      g.style.transform = "translate(" + dx + "px," + dy + "px)";
      g.style.transition = "transform .5s var(--ease)";
    });
  }
  setTimeout(() => requestAnimationFrame(eyeLoop), 70);
})();

/* ============================================================
   랜딩 섹션 인터랙션
   ============================================================ */
let landingCleanup = null;

function scrollToSection(id){
  const el = document.getElementById(id);
  if (el) el.scrollIntoView({ behavior: REDUCED ? "auto" : "smooth", block: "start" });
}

function initLanding(){
  if (landingCleanup) { landingCleanup(); landingCleanup = null; }

  const dots     = [...document.querySelectorAll("#dots button")];
  const sections = SECTIONS.map(s => document.getElementById(s.id)).filter(Boolean);
  const played   = new Set();

  /* 등장 애니메이션 — 한 번만 */
  const rises = [...document.querySelectorAll(".rise")];
  if (REDUCED) {
    rises.forEach(n => n.classList.add("in"));
    playStep5(); playChart(); drawRoutes(); setWhy(1);
  } else {
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (!e.isIntersecting) return;
        const group = [...e.target.parentElement.querySelectorAll(".rise")];
        const i = Math.max(0, group.indexOf(e.target));
        setTimeout(() => e.target.classList.add("in"), Math.min(i, 5) * 85);
        io.unobserve(e.target);
      });
    }, { rootMargin: "0px 0px -12% 0px", threshold: 0.12 });
    rises.forEach(n => io.observe(n));

    /* 섹션별 1회 재생 연출 */
    const secIo = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (!e.isIntersecting || played.has(e.target.id)) return;
        played.add(e.target.id);
        if (e.target.id === "s5") playStep5();
        if (e.target.id === "s7") playChart();
        if (e.target.id === "s8") drawRoutes();
      });
    }, { threshold: 0.35 });
    sections.forEach(sec => secIo.observe(sec));

    var cleanupIo = () => { io.disconnect(); secIo.disconnect(); };
  }

  /* 인디케이터 + S3 스크롤 연동 */
  let ticking = false;
  function update(){
    ticking = false;
    const mid = window.innerHeight * 0.42;
    let active = 0;
    sections.forEach((sec, i) => { if (sec.getBoundingClientRect().top <= mid) active = i; });
    dots.forEach((d, i) => d.setAttribute("aria-current", i === active ? "true" : "false"));

    const s3 = document.getElementById("s3");
    if (s3 && !REDUCED) {
      const r = s3.getBoundingClientRect();
      // 섹션이 화면을 채운 시점(top≈0)에 0.85쯤 되도록 잡아, 전환이 눈에 보이게 한다
      const prog = Math.max(0, Math.min(1, (window.innerHeight * 0.62 - r.top) / (r.height * 0.8)));
      setWhy(prog);
    }
  }
  function onScroll(){ if (!ticking) { ticking = true; requestAnimationFrame(update); } }
  window.addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("resize", onScroll);
  update();

  /* 키보드 섹션 이동 — 발표 중 마우스 없이 */
  function onKey(e){
    const t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const next = ["ArrowDown", "ArrowRight", "PageDown"].includes(e.key) || (e.key === " " && !e.shiftKey);
    const prev = ["ArrowUp", "ArrowLeft", "PageUp"].includes(e.key) || (e.key === " " && e.shiftKey);
    if (!next && !prev) return;
    e.preventDefault();
    const mid = window.innerHeight * 0.42;
    let cur = 0;
    sections.forEach((sec, i) => { if (sec.getBoundingClientRect().top <= mid) cur = i; });
    const to = Math.max(0, Math.min(sections.length - 1, cur + (next ? 1 : -1)));
    sections[to].scrollIntoView({ behavior: REDUCED ? "auto" : "smooth", block: "start" });
  }
  window.addEventListener("keydown", onKey);

  landingCleanup = () => {
    if (typeof cleanupIo === "function") cleanupIo();
    window.removeEventListener("scroll", onScroll);
    window.removeEventListener("resize", onScroll);
    window.removeEventListener("keydown", onKey);
    step5Timers.forEach(clearTimeout);
    step5Timers = [];
  };
}

/* S3 — 스크롤에 따라 왼쪽은 흐려지고 오른쪽은 선명해진다 */
function setWhy(prog){
  const oldEl = document.getElementById("whyOld");
  const newEl = document.getElementById("whyNew");
  if (!oldEl || !newEl) return;
  oldEl.style.opacity = (1 - prog * 0.65).toFixed(3);          // 1 → 0.35
  oldEl.style.filter  = "blur(" + (prog * 0.9).toFixed(2) + "px) grayscale(" + Math.round(prog * 100) + "%)";
  newEl.style.opacity = (0.4 + prog * 0.6).toFixed(3);
}

/* S5 — 1 → 2 → 3 순차 재생 */
let step5Timers = [];
function playStep5(){
  const typeEl = document.getElementById("mockType");
  const scan   = document.getElementById("scanline");
  const cells  = [...document.querySelectorAll("#grid30 .g-cell")];
  const res    = document.getElementById("mockRes");
  if (!typeEl) return;

  const text = "대학 안 가면 후회한대요";
  if (REDUCED) {
    typeEl.textContent = text;
    [4, 11, 22].forEach(i => cells[i] && cells[i].classList.add("hit"));
    if (res) res.style.opacity = "1";
    return;
  }

  step5Timers.forEach(clearTimeout);
  step5Timers = [];
  typeEl.textContent = "";
  cells.forEach(c => c.classList.remove("hit"));
  if (res) res.style.opacity = "0";
  if (scan) scan.classList.remove("run");

  let i = 0;
  (function type(){
    if (i > text.length) return;
    typeEl.textContent = text.slice(0, i++);
    step5Timers.push(setTimeout(type, 78));
  })();

  const t1 = text.length * 78 + 420;
  step5Timers.push(setTimeout(() => { if (scan) { scan.classList.remove("run"); void scan.offsetWidth; scan.classList.add("run"); } }, t1));
  [4, 11, 22].forEach((idx, k) => {
    step5Timers.push(setTimeout(() => { if (cells[idx]) cells[idx].classList.add("hit"); }, t1 + 620 + k * 200));
  });
  step5Timers.push(setTimeout(() => { if (res) res.style.opacity = "1"; }, t1 + 1500));
}

/* S7 — 실제 집계값까지 자라는 막대 + 숫자 카운트업 */
function playChart(){
  const wrap = document.getElementById("barWrap");
  if (!wrap) return;
  const bars = [...wrap.querySelectorAll(".bar")];
  const nums = [...wrap.querySelectorAll(".bar-num")];

  if (REDUCED) {
    bars.forEach(b => b.style.height = b.dataset.h + "%");
    nums.forEach(n => n.textContent = n.dataset.to);
    return;
  }

  const dur = 1100, t0 = performance.now();
  (function frame(now){
    const p = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - p, 3);
    bars.forEach(b => b.style.height = (parseFloat(b.dataset.h) * e).toFixed(2) + "%");
    nums.forEach(n => n.textContent = Math.round(parseFloat(n.dataset.to) * e));
    if (p < 1) requestAnimationFrame(frame);
  })(t0);
}

/* S8 — 갈래가 순차적으로 그려진다 */
function drawRoutes(){
  const paths = [...document.querySelectorAll("#routeSvg .rt-path")];
  if (!paths.length) return;
  paths.forEach((path, i) => {
    const len = path.getTotalLength();
    path.style.strokeDasharray  = len;
    if (REDUCED) { path.style.strokeDashoffset = 0; return; }
    path.style.strokeDashoffset = len;
    path.style.transition = "none";
    void path.getBoundingClientRect();
    setTimeout(() => {
      path.style.transition = "stroke-dashoffset 1s cubic-bezier(.3,.7,.3,1)";
      path.style.strokeDashoffset = 0;
    }, 90 * i);
  });
}

function initTimeline(){
  if (tlCleanup) { tlCleanup(); tlCleanup = null; }

  const tl   = document.getElementById("timeline");
  const fill = document.getElementById("tlFill");
  if (!tl || !fill) return;

  const items = [...tl.querySelectorAll(".tl-item")];

  if (REDUCED) {
    items.forEach(i => i.classList.add("in"));
    fill.style.height = "100%";
    return;
  }

  /* 노드가 순차로 나타난다 */
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        const i = items.indexOf(e.target);
        setTimeout(() => e.target.classList.add("in"), Math.min(i, 3) * 90);
        io.unobserve(e.target);
      }
    });
  }, { rootMargin: "0px 0px -18% 0px", threshold: 0.15 });
  items.forEach(i => io.observe(i));

  /* 선이 위에서 아래로 그려진다 */
  let ticking = false;
  function update(){
    ticking = false;
    const r    = tl.getBoundingClientRect();
    const line = tl.offsetHeight - 32;
    const mark = window.innerHeight * 0.62;
    const prog = Math.max(0, Math.min(1, (mark - r.top) / Math.max(1, r.height)));
    fill.style.height = Math.round(line * prog) + "px";
  }
  function onScroll(){
    if (!ticking) { ticking = true; requestAnimationFrame(update); }
  }
  window.addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("resize", onScroll);
  update();

  tlCleanup = () => {
    io.disconnect();
    window.removeEventListener("scroll", onScroll);
    window.removeEventListener("resize", onScroll);
  };
}

/* ============================================================
   #/explore  둘러보기 — 서른 명이 경로별로 모여 떠 있다

  /* 8개 그룹을 큰 원 둘레에, 각 그룹 인원은 그 주위에 흩어 놓는다 */
  const nodes = [];
  ROUTE_GROUPS.forEach((g, gi) => {
    const members = PEOPLE.filter(p => groupOf(p) === g.tag);
    const a = gi / ROUTE_GROUPS.length * Math.PI * 2 - Math.PI / 2;
    const gx = 50 + Math.cos(a) * 33;
    const gy = 50 + Math.sin(a) * 34;
    nodes.push({ group:true, tag:g.tag, label:g.label, x:gx, y:gy - 13 });
    members.forEach((p, i) => {
      const a2 = i / members.length * Math.PI * 2 + gi;
      nodes.push({
        p, tag:g.tag,
        x:gx + Math.cos(a2) * 7.4,
        y:gy + Math.sin(a2) * 8.6,
        size:p.regret.level === "많이 있음" ? 62 : 54,
        dx:(Math.random() * 12 - 6).toFixed(1) + "px",
        dy:(Math.random() * 12 - 6).toFixed(1) + "px",
        dur:(7 + Math.random() * 5).toFixed(1) + "s",
        delay:(-Math.random() * 6).toFixed(1) + "s"
      });
    });
  });

  app.innerHTML = '' +
    siteHeader("") +
    '<div class="wrap py-9 md:py-12">' +
      '<div class="ex-head">' +
        '<p class="kicker mb-3">둘러보기</p>' +
        '<h1 class="font-extrabold tracking-[-0.04em]" style="font-size:clamp(26px,3.6vw,42px);line-height:1.22">' +
          "서른 명이 각자<br/>다른 길로 갔어." +
        "</h1>" +
        '<p class="mt-4 text-[14.5px] font-semibold text-ink2 leading-relaxed">' +
          "가까이 대면 누구인지 보이고, 누르면 그 사람 이야기로 가." +
        "</p>" +
      "</div>" +

      '<div class="ex-filters" id="exFilters">' +
        '<button class="ex-f" data-f="all" aria-pressed="true">전체<b>30</b></button>' +
        ROUTE_GROUPS.map(g =>
          '<button class="ex-f" data-f="' + esc(g.tag) + '" aria-pressed="false">' +
            esc(g.label) + "<b>" + routeCount(g.tag) + "</b></button>"
        ).join("") +
      "</div>" +

      '<div class="ex-field" id="exField">' +
        '<div class="ex-mid">' +
          '<div class="idle"><b>별의별</b><span>길이 다 있어.<br/>정답은 아직 아무도 몰라.</span></div>' +
          '<div class="info" id="exInfo" aria-live="polite"></div>' +
        "</div>" +
        nodes.map(n => {
          if (n.group)
            return '<span class="ex-group" data-tag="' + esc(n.tag) + '" ' +
                   'style="left:' + n.x + '%;top:' + n.y + '%">' + esc(n.label) + "</span>";
          const p = n.p;
          return '<button class="orb' + (n.y > 62 ? " low" : "") + '" data-person="' + p.id + '" ' +
              'data-tag="' + esc(n.tag) + '" ' +
              'aria-label="' + esc(p.name + ", " + p.age + "세, " + p.currentJob + ", 후회 " + p.regret.level) + '" ' +
              'style="left:' + n.x + '%;top:' + n.y + '%;--size:' + n.size + 'px;' +
              '--dx:' + n.dx + ';--dy:' + n.dy + ';--dur:' + n.dur + ';--delay:' + n.delay + '">' +
            '<span class="orb-fig">' + figSVG(p) + "</span>" +
            '<span class="orb-card">' +
              '<span class="n">' + esc(p.name) + " " + p.age + "세</span>" +
              '<span class="j">' + esc(p.currentJob) + "</span>" +
              '<span class="r">' + esc(p.routeSummary) + "</span>" +
              '<span class="b">' + badge(p.regret.level) + "</span>" +
            "</span>" +
          "</button>";
        }).join("") +
      "</div>" +
    "</div>";

  bindSearchForms(app);

  const field = document.getElementById("exField");
  const info  = document.getElementById("exInfo");
  function peek(id){
    if (!id){ field.classList.remove("peek"); return; }
    const p = BY_ID[id];
    info.innerHTML =
      '<div class="nm">' + esc(p.name) + ' <span style="font-size:.6em;color:var(--ink3)">' + p.age + '세</span></div>' +
      '<div class="jb">' + esc(p.currentJob) + "</div>" +
      '<div class="rt">' + esc(p.routeSummary) + "</div>" +
      '<div class="bg">' + badge(p.regret.level) + "</div>" +
      '<div class="go">눌러서 이야기 보기 →</div>';
    field.classList.add("peek");
  }
  /* 위임은 focus 이동 순서에 따라 갱신을 놓칠 수 있어 각 요소에 직접 건다 (30개뿐) */
  field.querySelectorAll("[data-person]").forEach(o => {
    const id = o.getAttribute("data-person");
    o.addEventListener("pointerenter", () => peek(id));
    o.addEventListener("focus", () => peek(id));
    o.addEventListener("pointerleave", () => peek(null));
    o.addEventListener("blur", () => peek(null));
  });

  app.addEventListener("click", e => {
    const orb = e.target.closest("[data-person]");
    if (orb) { go("/person/" + orb.getAttribute("data-person")); return; }
    const f = e.target.closest("[data-f]");
    if (!f) return;
    const tag = f.getAttribute("data-f");
    app.querySelectorAll("[data-f]").forEach(b => b.setAttribute("aria-pressed", String(b === f)));
    if (tag === "all") { field.removeAttribute("data-focus"); }
    else field.setAttribute("data-focus", tag);
    field.querySelectorAll(".orb, .ex-group").forEach(el =>
      el.classList.toggle("on", el.getAttribute("data-tag") === tag));
  });
}

/* ============================================================
   #/parent/:id  부모 전용 페이지
   ============================================================ */
function plainify(text){
  let out = esc(text);
  const used = [];
  GLOSS_KEYS.forEach(k => {
    const ek = esc(k);
    const at = out.indexOf(ek);
    if (at === -1) return;
    if (used.some(u => ek.includes(u) || u.includes(ek))) return;   // 겹치는 용어는 한 번만
    used.push(ek);
    out = out.slice(0, at) + ek + '<span class="gloss">(' + esc(GLOSSARY[k]) + ")</span>" + out.slice(at + ek.length);
  });
  return out;
}

function renderParent(id){
  const p = BY_ID[id];
  if (!p) { go("/"); return; }

  document.body.classList.add("parent-view");

  app.innerHTML = '' +
  '<div class="wrap-narrow py-12 md:py-20">' +

    '<p style="font-size:17px;font-weight:800;letter-spacing:.09em;color:#9A7B4F">먼저 이 길을 걸어간 사람</p>' +

    "<h1 class=\"mt-5\">" + esc(p.name) + " 님은 지금<br/>" + plainify(p.currentJob) + "로<br/>일하고 있습니다.</h1>" +

    '<p class="p-body mt-7">올해 ' + p.age + "세입니다. " +
      esc(p.name) + " 님도 " + p.timeline[0].age + "세 무렵, 부모님과 진로 때문에 크게 부딪혔습니다.</p>" +

    '<div class="p-card mt-12">' +

      '<div class="mt-7">' +
        p.timeline.map(t =>

            "<div>" +
              '<div style="font-size:22px;font-weight:800;line-height:1.45">' + plainify(t.title) + "</div>" +
              '<div class="p-body" style="font-size:19px;line-height:1.9;margin-top:8px">' + plainify(t.desc) + "</div>" +

        ).join("") +

    '<div class="mt-12" style="background:#F6F0E2;border-radius:16px;padding:34px 32px">' +
      "<h2>그때 이 사람의 부모님이 하셨던 말</h2>" +
      '<p class="p-body" style="margin-top:18px;font-weight:700;color:#4A4034">' + plainify(p.parentWords) + "</p>" +
    "</div>" +

    '<div class="mt-12">' +
      "<h2>그래서 어떻게 됐는지</h2>" +

    "</div>" +

    '<div class="p-card mt-12" style="border-color:#D9CBA6;background:#FFFCF2">' +
      "<h2>이 사람의 부모님은 지금 이렇게 말씀하십니다</h2>" +
      '<p class="p-body mt-5" style="font-weight:700">' + plainify(p.parentNow) + "</p>" +
    "</div>" +

    '<div class="mt-12">' +
      "<h2>후회하지 않느냐고 물었더니</h2>" +
      '<p class="p-body mt-5">' + plainify(p.regret.text) + "</p>" +
      '<p style="font-size:18px;font-weight:700;color:#7A5A3C;margin-top:16px">— 이 사람은 “후회가 ' + esc(p.regret.level) + '”이라고 답했습니다.</p>' +
    "</div>" +

    '<div class="mt-16 pt-9" style="border-top:2px solid #E8DFC8">' +
      '<p style="font-size:22px;font-weight:800;color:#4A4034">이 페이지는 자녀분이 보냈습니다.</p>' +
      '<p class="p-body mt-4" style="color:#6B6255">한 사람의 이야기일 뿐, 정답은 아닙니다.<br/>다만 이런 길을 걸어간 사람이 실제로 있다는 것만 전하고 싶었다고 합니다.</p>' +
      '<div class="mt-9 flex flex-wrap gap-3">' +
        '<a href="#/person/' + p.id + '" style="font-size:19px;font-weight:800;color:#8A5A2B;text-decoration:underline;text-underline-offset:6px">원래 화면으로 돌아가기</a>' +

/* ============================================================
   라우터
   ============================================================ */
function parseHash(){
  const raw = (location.hash || "#/").slice(1) || "/";
  const qi   = raw.indexOf("?");
  const path = qi === -1 ? raw : raw.slice(0, qi);
  const qs   = qi === -1 ? ""  : raw.slice(qi + 1);
  return { path, params: new URLSearchParams(qs) };
}

function route(){
  renderToken++;
  if (tlCleanup) { tlCleanup(); tlCleanup = null; }
  if (landingCleanup) { landingCleanup(); landingCleanup = null; }
  document.documentElement.classList.remove("snap");   // 랜딩에서만 다시 켠다
  document.body.classList.remove("parent-view");

  const { path, params } = parseHash();
  const seg = path.split("/").filter(Boolean);

  if (path === "/" || seg.length === 0) {
    renderLanding();
  } else if (seg[0] === "search") {
    const q = (params.get("q") || "").trim();
    if (!q) { go("/"); return; }
    clearIntro(); introDone = true;
    document.getElementById("introOverlay").hidden = true;
    document.getElementById("skipBtn").hidden = true;
    renderSearch(q);
  } else if (seg[0] === "person" && seg[1]) {
    clearIntro(); introDone = true;
    document.getElementById("introOverlay").hidden = true;
    document.getElementById("skipBtn").hidden = true;
    renderPerson(seg[1]);
  } else if (seg[0] === "explore") {
    clearIntro(); introDone = true;
    document.getElementById("introOverlay").hidden = true;
    document.getElementById("skipBtn").hidden = true;
    renderExplore();
  } else if (seg[0] === "parent" && seg[1]) {
    clearIntro(); introDone = true;
    document.getElementById("introOverlay").hidden = true;
    document.getElementById("skipBtn").hidden = true;
    renderParent(seg[1]);
  } else {
    go("/");
    return;
  }
  window.scrollTo({ top: 0, behavior: "auto" });
}

loadSession();
document.getElementById("skipBtn").addEventListener("click", endIntro);
window.addEventListener("hashchange", route);
route();
</script>
